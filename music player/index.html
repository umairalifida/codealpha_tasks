<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="music-player">
      <div class="player">
        <div class="album-art">
          <img
            id="cover"
            src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=800&q=80"
            alt="Album Cover"
          />
        </div>

        <div class="song-info">
          <h1 id="song-title">Song Title</h1>

          <p id="artist">Artist Name</p>
        </div>

        <div class="progress-container">
          <span id="current-time"> 0:00 </span>

          <input type="range" id="progress" value="0" min="0" max="100" />

          <span id="duration"> 0:00 </span>
        </div>

        <div class="controls">
          <button id="prev" class="control-btn">⏮</button>

          <button id="play" class="play-btn">▶</button>

          <button id="next" class="control-btn">⏭</button>
        </div>

        <div class="volume-container">
          <span> 🔊 </span>

          <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </div>

        <audio id="audio"></audio>
      </div>

      <div class="playlist">
        <h2>Playlist</h2>

        <div id="playlist" class="playlist-items"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
